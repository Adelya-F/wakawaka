AWSTemplateFormatVersion: '2010-09-09'
Description: 'Serverless Infrastructure - API Gateway Stack Only'

Parameters:
  LambdaOrderManagementArn:
    Type: String
    Description: ARN of the Order Management Lambda Function
  
Resources:
  RestAPI:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: lks-api-orders
      EndpointConfiguration:
        Types:
          - REGIONAL

  OrdersResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestAPI
      ParentId: !GetAtt RestAPI.RootResourceId
      PathPart: orders

  OrdersIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestAPI
      ParentId: !Ref OrdersResource
      PathPart: "{id}"

  PostOrders:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestAPI
      ResourceId: !Ref OrdersResource
      HttpMethod: POST
      AuthorizationType: NONE
      ApiKeyRequired: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaOrderManagementArn}/invocations

  GetOrders:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestAPI
      ResourceId: !Ref OrdersResource
      HttpMethod: GET
      AuthorizationType: NONE
      ApiKeyRequired: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaOrderManagementArn}/invocations

  APIDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - PostOrders
      - GetOrders
    Properties:
      RestApiId: !Ref RestAPI

  APIStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref RestAPI
      DeploymentId: !Ref APIDeployment
      StageName: production

  APIKey:
    Type: AWS::ApiGateway::ApiKey
    DependsOn: APIStage
    Properties:
      Name: lks-api-key
      Enabled: true
      StageKeys:
        - RestApiId: !Ref RestAPI
          StageName: production

  UsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    Properties:
      UsagePlanName: lks-usage-plan
      ApiStages:
        - ApiId: !Ref RestAPI
          Stage: !Ref APIStage

  UsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref APIKey
      KeyType: API_KEY
      UsagePlanId: !Ref UsagePlan

  LambdaPermissionAPIGW:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LambdaOrderManagementArn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestAPI}/*

Outputs:
  APIGatewayURL:
    Value: !Sub https://${RestAPI}.execute-api.${AWS::Region}.amazonaws.com/production/orders
  APIKeyValue:
    Description: "Copy this key for your API requests"
    Value: !Ref APIKey